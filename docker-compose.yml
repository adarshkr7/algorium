# Runs the whole stack locally: web, both workers, Postgres and Redis.
#
#   cp .env.example .env   # then fill in the Supabase values
#   docker compose up --build
#
# Postgres here is for local work. Point DATABASE_URL at the managed instance
# and drop the `postgres` service to run this against a real database.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: algorium
      POSTGRES_PASSWORD: algorium
      POSTGRES_DB: algorium
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algorium"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: web
      args:
        # Public values are compiled into the client bundle, so they have to be
        # present at build time rather than only at run time.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-}
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://algorium:algorium@postgres:5432/algorium
      DIRECT_URL: postgresql://algorium:algorium@postgres:5432/algorium
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  workers:
    build:
      context: .
      target: workers
    environment:
      DATABASE_URL: postgresql://algorium:algorium@postgres:5432/algorium
      DIRECT_URL: postgresql://algorium:algorium@postgres:5432/algorium
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Safe to raise: the workers elect a leader through Redis, so the extras
    # stand by rather than duplicating Codeforces traffic.
    deploy:
      replicas: 1

volumes:
  pgdata:
